<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- CSS linear-gradient(135deg, #C33638, #B24B6F) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C33638"/>
      <stop offset="1" stop-color="#B24B6F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- wordmark: baseline 262, ink top 186 -->
    <text x="450" y="262" font-size="104" font-weight="700" letter-spacing="2"
          fill="#ffffff">Govori</text>

    <!-- acute over the second 'o' (ink centre x=682), mirroring .accented::after:
         #FECB00, weight 900, scaleX(1.3). Inner x=-5.5 cancels the glyph's
         own ink offset from the anchor once scaled. -->
    <g transform="translate(682 265)">
      <text x="-5.5" y="0" font-size="104" font-weight="900" text-anchor="middle"
            transform="scale(1.3 1)" fill="#FECB00">´</text>
    </g>

    <text x="450" y="340" font-size="44" font-weight="600" fill="#ffffff"
          opacity="0.95">Montenegrin Learner’s Dictionary</text>

    <text x="450" y="400" font-size="29" fill="#ffffff"
          opacity="0.82">Any word form → the canonical entry</text>

    <text x="450" y="446" font-size="26" fill="#ffffff"
          opacity="0.66">Full paradigms · Latin and Cyrillic · Offline · No ads</text>
  </g>
</svg>
