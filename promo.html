<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Govori — special offer</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/app-icon-256.png">
  <link rel="apple-touch-icon" href="../img/app-icon-256.png">
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #7c6fd0 0%, #5b4fa8 100%); color: #fff;
      padding: 24px; text-align: center;
    }
    .card { max-width: 420px; width: 100%; }
    .icon { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 2rem; margin-bottom: 6px; overflow-wrap: break-word; }
    .pitch { opacity: 0.9; margin-bottom: 28px; line-height: 1.45; }
    .btn {
      display: block; width: 100%; padding: 14px 20px; margin-bottom: 12px;
      border-radius: 999px; font-size: 1.05rem; font-weight: 600;
      text-decoration: none; cursor: pointer; border: none;
    }
    .btn-primary { background: #fff; color: #5b4fa8; }
    .btn-secondary { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.35); }
    .home { display: inline-block; margin-top: 16px; color: rgba(255,255,255,0.75); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="../img/app-icon-256.png" alt="Govori">
    <h1>Govori</h1>
    <p class="pitch" id="pitch">This link unlocks a special offer in the Govori Serbian dictionary app for Android.</p>
    <button class="btn btn-primary" id="openBtn">Open in the app</button>
    <a class="btn btn-secondary" id="getBtn" href="https://play.google.com/store/apps/details?id=com.langapp.srb&amp;referrer=utm_source%3Dpromo%26utm_medium%3Dpromo%26utm_campaign%3Dpromo_page">Get the app on Google Play</a>
    <a class="home" href="https://govoridictionaries.com/">govoridictionaries.com</a>
  </div>

  <script>
    // Partner discount links: https://govoridictionaries.com/promo?code=…
    // Mirrors the in-app govorisrb://promo?code=… deep link (Deeplink.kt /
    // Deeplink.swift). Both platforms since 2026-08-20 — the store fallback is
    // therefore platform-aware. Structure mirrors ../w/.
    // &referrer= carries URL-encoded UTMs: Play Console reports on utm_source
    // and utm_campaign today, and the Adjust SDK reads the whole string later.
    // iOS has no deferred deep linking, so an iPhone user who installs from
    // here must come back and tap the link again — that is what pitchNoApp says.
    var GET_APP_PLAY = 'https://play.google.com/store/apps/details?id=com.langapp.srb' +
      '&referrer=utm_source%3Dpromo%26utm_medium%3Dpromo%26utm_campaign%3Dpromo_page';
    var GET_APP_IOS =
      'https://apps.apple.com/app/apple-store/id6758169365?pt=128478223&ct=promo_page&mt=8';

    var params = new URLSearchParams(location.search);
    var code = params.get('code') || '';
    var query = location.search.replace(/^\?/, '');
    var schemeUrl = 'govorisrb://promo?' + query;

    var ua = navigator.userAgent;
    var isAndroid = /Android/i.test(ua);
    // iPadOS 13+ reports a Mac UA, so the touch-point check is what catches it.
    var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
      (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var isRu = (navigator.language || '').toLowerCase().indexOf('ru') === 0;

    var STRINGS = {
      en: {
        pitch: 'This link unlocks a special price in Govori, the Serbian learner’s dictionary — every form, full tables, offline.',
        pitchNoApp: 'Install Govori first, then open this link again to claim the offer.',
        open: 'Open in the app',
        get: 'Get the app on Google Play',
        getIOS: 'Download on the App Store'
      },
      ru: {
        pitch: 'Эта ссылка открывает специальную цену в Govori — сербском словаре для изучающих: любая форма, полные таблицы, офлайн.',
        pitchNoApp: 'Сначала установите Govori, затем откройте эту ссылку ещё раз, чтобы получить предложение.',
        open: 'Открыть в приложении',
        get: 'Скачать в Google Play',
        getIOS: 'Загрузить в App Store'
      }
    };
    var t = isRu ? STRINGS.ru : STRINGS.en;

    document.getElementById('pitch').textContent =
      (isAndroid || isIOS) ? t.pitch : t.pitchNoApp;
    document.getElementById('openBtn').textContent = t.open;
    var getBtn = document.getElementById('getBtn');
    getBtn.textContent = isIOS ? t.getIOS : t.get;
    getBtn.href = isIOS ? GET_APP_IOS : GET_APP_PLAY;

    // withFallback matters: Chrome refuses gesture-less intent:// launches but
    // still navigates to S.browser_fallback_url — so an automatic attempt WITH
    // a fallback lands on the Play listing even when the app is installed. The
    // auto attempt therefore omits the fallback (blocked = page stays up, user
    // taps the button), and only the button tap — a real gesture — carries it.
    function openInApp(withFallback) {
      if (isAndroid) {
        var fallback = withFallback
          ? ';S.browser_fallback_url=' + encodeURIComponent(GET_APP_PLAY)
          : '';
        location.href = 'intent://promo?' + query +
          '#Intent;scheme=govorisrb;package=com.langapp.srb' + fallback + ';end';
      } else {
        location.href = schemeUrl;
      }
    }
    document.getElementById('openBtn').addEventListener('click', function () {
      openInApp(true);
    });

    // One automatic attempt on Android, so tapping a shared link goes straight
    // into the app when it's installed. iOS needs none: the universal link is
    // claimed in AASA, so an installed app intercepts /promo before this page
    // ever loads — and a gesture-less scheme navigation on iOS would only
    // produce an "address invalid" dialog when it isn't installed.
    if (isAndroid && code) {
      setTimeout(function () { openInApp(false); }, 300);
    }
  </script>
</body>
</html>
